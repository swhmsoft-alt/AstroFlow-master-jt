<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Titanium anode with lead wire attached placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g stroke="#38BDF8" stroke-width="1.6" fill="none" opacity="0.75">
    <!-- anode body (rectangle) -->
    <rect x="260" y="230" width="280" height="140" rx="6" stroke-dasharray="6 4"/>
    <text x="400" y="310" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#F8FAFC" letter-spacing="2" stroke="none">MMO ANODE</text>
    <!-- lead wire (curved line going up and right) -->
    <path d="M 540 250 C 600 220, 640 200, 700 180" stroke-width="2.5"/>
    <!-- sealed boot at junction -->
    <ellipse cx="540" cy="252" rx="14" ry="10" fill="#34D399" fill-opacity="0.25" stroke="#34D399" stroke-width="1.2"/>
    <!-- power terminal dot -->
    <circle cx="700" cy="180" r="6" fill="#38BDF8" stroke="none"/>
  </g>
  <text x="400" y="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC" letter-spacing="2">LEAD-WIRE ASSEMBLY</text>
  <text x="400" y="528" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#94A3B8" letter-spacing="1">CUSTOM DRAWING-BASED</text>
</svg>