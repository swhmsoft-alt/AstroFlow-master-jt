<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="MMO coating process diagram placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g opacity="0.85">
    <!-- substrate layer -->
    <rect x="180" y="220" width="440" height="160" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="400" y="310" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#94A3B8" letter-spacing="1">Ti SUBSTRATE</text>
    <!-- coating layer -->
    <rect x="180" y="160" width="440" height="56" rx="4" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="400" y="194" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#F8FAFC" letter-spacing="1">MMO COATING</text>
    <!-- arrow from coating to substrate -->
    <line x1="400" y1="218" x2="400" y2="232" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="394,232 406,232 400,242" fill="#38BDF8"/>
    <!-- electrolyte above -->
    <rect x="180" y="100" width="440" height="50" rx="4" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="400" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#34D399" letter-spacing="1">ELECTROLYTE</text>
  </g>
  <text x="400" y="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC" letter-spacing="2">COATING SYSTEM</text>
  <text x="400" y="528" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#94A3B8" letter-spacing="1">IrO2 / RuO2 / Pt / MIXED MMO</text>
</svg>