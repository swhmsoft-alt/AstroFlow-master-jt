<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e8eef6"/>
      <stop offset="0.45" stop-color="#c3d0e0"/>
      <stop offset="1" stop-color="#93a4bb"/>
    </linearGradient>
    <linearGradient id="sideFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa0b6"/>
      <stop offset="1" stop-color="#5d6d84"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="400" fill="#1e3a5f" opacity="0.18"/>
  <ellipse cx="512" cy="806" rx="352" ry="58" fill="#000000" opacity="0.45"/>

  <!-- Disc edge thickness -->
  <g>
    <path d="M162 470 L162 556 A350 350 0 0 0 862 556 L862 470 Z" fill="url(#sideFace)"/>
    <ellipse cx="512" cy="470" rx="350" ry="126" fill="url(#topFace)"/>
    <!-- Outer rim highlight -->
    <ellipse cx="512" cy="470" rx="350" ry="126" fill="none" stroke="#f1f5f9" stroke-width="3" opacity="0.55"/>
    <ellipse cx="512" cy="470" rx="318" ry="112" fill="none" stroke="#5d6d84" stroke-width="2" opacity="0.5"/>
    <!-- Concentric turning marks -->
    <ellipse cx="512" cy="470" rx="286" ry="100" fill="none" stroke="#7c8ca3" stroke-width="1.5" opacity="0.42"/>
    <ellipse cx="512" cy="470" rx="250" ry="88" fill="none" stroke="#7c8ca3" stroke-width="1.5" opacity="0.34"/>
    <ellipse cx="512" cy="470" rx="214" ry="75" fill="none" stroke="#7c8ca3" stroke-width="1.5" opacity="0.28"/>
    <!-- Specular sheen across the machined face -->
    <ellipse cx="512" cy="470" rx="350" ry="126" fill="url(#sheen)"/>
    <!-- Central register step (raised boss) -->
    <ellipse cx="512" cy="470" rx="104" ry="38" fill="#b6c3d4"/>
    <ellipse cx="512" cy="470" rx="104" ry="38" fill="none" stroke="#4b5a70" stroke-width="3"/>
    <path d="M408 470 L408 500 A104 38 0 0 0 616 500 L616 470 Z" fill="#9aa8bd"/>
    <ellipse cx="512" cy="470" rx="62" ry="22" fill="#d7e0ec"/>
    <ellipse cx="512" cy="470" rx="62" ry="22" fill="none" stroke="#4b5a70" stroke-width="3"/>
    <ellipse cx="512" cy="470" rx="30" ry="11" fill="#8b9ab0" stroke="#4b5a70" stroke-width="2.5"/>
  </g>

  <!-- Heat / lot marking on the face -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" fill="#3d4b5e" opacity="0.72">
    <text x="330" y="336">F67 / Gr2</text>
    <text x="330" y="364">LOT 24-117</text>
    <text x="330" y="392">Ø98 OPEN</text>
  </g>

  <!-- Diameter dimension line -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M162 880 L862 880"/>
    <path d="M162 858 L162 902 M862 858 L862 902"/>
  </g>
  <text x="512" y="922" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="4" fill="#94a3b8">&#216;98 MM</text>
</svg>
