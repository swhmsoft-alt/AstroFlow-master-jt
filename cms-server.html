<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客管理后台 — BOZE CNC Ti</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{deep:'#0F172A',indigo:'#1E293B',laser:'#38BDF8',offwhite:'#F8FAFC'}}}}</script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0F172A;color:#F8FAFC}
.editor{min-height:500px;font-family:monospace;font-size:14px;line-height:1.7;tab-size:2;resize:vertical;outline:none}
.editor:focus{border-color:rgba(56,189,248,0.5)}
.preview h1{font-size:1.8rem;font-weight:700;margin-bottom:1rem;color:#38BDF8}
.preview h2{font-size:1.4rem;font-weight:600;margin-top:1.5rem;margin-bottom:.5rem;color:#F8FAFC}
.preview h3{font-size:1.2rem;font-weight:600;margin-top:1rem;margin-bottom:.5rem;color:#F8FAFC}
.preview p{margin-bottom:.75rem;line-height:1.7;color:#CBD5E1}
.preview img{max-width:100%;border-radius:8px;margin:1rem 0}
.preview code{background:#1E293B;padding:.15rem .4rem;border-radius:4px;font-size:.9em;color:#38BDF8}
.preview pre{background:#1E293B;padding:1rem;border-radius:8px;overflow-x:auto;border:1px solid rgba(56,189,248,.1)}
.preview ul{list-style:disc;padding-left:1.5rem;margin-bottom:.75rem}
.preview li{color:#CBD5E1;margin:.25rem 0}
.preview a{color:#38BDF8;text-decoration:underline}
.preview strong{color:#F8FAFC;font-weight:700}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
</style>
</head>
<body class="min-h-screen">
<div id="app" class="p-4 max-w-7xl mx-auto">
  <div class="flex items-center justify-between mb-6 pb-4 border-b border-indigo-800">
    <div>
      <h1 class="text-2xl font-bold" style="color:#38BDF8">&#9997;&#65039; 博客管理后台</h1>
      <p class="text-sm mt-1" style="color:#94A3B8">在本地撰写博文，一键发布到线上网站 — 不影响线上运行</p>
    </div>
    <div class="flex gap-3 items-center">
      <a href="http://localhost:4321/blog" target="_blank" class="text-sm hover:underline" style="color:#38BDF8">本地预览</a>
      <button onclick="deploySite()" class="px-4 py-2 font-bold rounded-lg text-sm hover:opacity-90 transition" style="background:#38BDF8;color:#0F172A">&#128640; 发布到线上</button>
    </div>
  </div>

  <div class="flex gap-6">
    <!-- 侧边栏 -->
    <div class="w-72 shrink-0">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold uppercase tracking-wider" style="color:#94A3B8">文章列表</h2>
        <button onclick="newPost()" class="text-sm hover:underline" style="color:#38BDF8">+ 新建</button>
      </div>
      <div id="postList" class="space-y-1 max-h-[calc(100vh-12rem)] overflow-y-auto pr-2">
        <div class="text-sm py-4 text-center" style="color:#64748B">加载中...</div>
      </div>
    </div>

    <!-- 编辑器 -->
    <div class="flex-1" id="editorPanel" style="display:none">
      <div class="flex items-center justify-between mb-3">
        <h2 id="editTitle" class="text-lg font-bold" style="color:#38BDF8"></h2>
        <div class="flex gap-2">
          <button onclick="savePost()" class="px-4 py-1.5 font-bold rounded-lg text-sm hover:opacity-90 transition" style="background:#38BDF8;color:#0F172A">&#128190; 保存</button>
          <button onclick="togglePreview()" class="px-4 py-1.5 font-bold rounded-lg text-sm border transition" id="previewBtn" style="background:#1E293B;color:#38BDF8;border-color:rgba(56,189,248,0.3)">&#128065;&#65039; 预览</button>
        </div>
      </div>
      <div class="flex gap-4">
        <textarea id="editor" class="editor w-full rounded-xl p-4 border" style="background:#1E293B;border-color:#1E293B;color:rgba(248,250,252,0.9)"></textarea>
        <div id="preview" class="preview w-full rounded-xl p-4 border overflow-y-auto max-h-[calc(100vh-12rem)]" style="display:none;background:#1E293B;border-color:#1E293B"></div>
      </div>
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="flex-1 flex items-center justify-center" style="color:#64748B">
      <div class="text-center">
        <p class="text-4xl mb-4">&#128221;</p>
        <p>选择左侧文章开始编辑</p>
        <p class="text-sm mt-2">或点击「+ 新建」创建新博文</p>
      </div>
    </div>
  </div>
</div>

<!-- 新建文章弹窗 -->
<div id="newPostModal" class="fixed inset-0 flex items-center justify-center z-50" style="display:none;background:rgba(0,0,0,0.6)">
  <div class="rounded-2xl p-8 w-full max-w-md border" style="background:#1E293B;border-color:rgba(56,189,248,0.2)">
    <h2 class="text-xl font-bold mb-4" style="color:#38BDF8">新建文章</h2>
    <label class="block text-sm mb-1" style="color:#94A3B8">文章标题</label>
    <input id="newTitle" class="w-full px-4 py-2 rounded-lg border mb-4" style="background:#0F172A;border-color:#1E293B;color:#F8FAFC" placeholder="输入标题">
    <label class="block text-sm mb-1" style="color:#94A3B8">URL 标识 (slug)</label>
    <input id="newSlug" class="w-full px-4 py-2 rounded-lg border mb-6" style="background:#0F172A;border-color:#1E293B;color:#F8FAFC" placeholder="my-new-post">
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal()" class="px-4 py-2 transition" style="color:#94A3B8">取消</button>
      <button onclick="createPost()" class="px-6 py-2 font-bold rounded-lg hover:opacity-90 transition" style="background:#38BDF8;color:#0F172A">创建</button>
    </div>
  </div>
</div>

<script>
let currentFile = null;
let showPreview = false;

function loadPostList() {
  fetch('/api/posts').then(r=>r.json()).then(posts => {
    const list = document.getElementById('postList');
    list.innerHTML = posts.map(p => {
      const active = currentFile === p.file ? 'border border-laser/30' : '';
      return '<div onclick="loadPost(\'' + p.file + '\')" class="px-3 py-2.5 rounded-lg cursor-pointer hover:bg-indigo transition text-sm" id="post-' + p.file.replace(/[^a-zA-Z0-9-]/g,'_') + '">' +
        '<div class="font-medium truncate" style="color:#F8FAFC">' + esc(p.title) + '</div>' +
        '<div class="text-xs mt-0.5" style="color:#64748B">' + esc(p.date || '') + '</div>' +
        '</div>';
    }).join('');
  });
}

function loadPost(file) {
  currentFile = file;
  document.querySelectorAll('#postList > div').forEach(el => {
    el.className = 'px-3 py-2.5 rounded-lg cursor-pointer hover:bg-indigo transition text-sm';
  });
  const safeId = 'post-' + file.replace(/[^a-zA-Z0-9-]/g,'_');
  const el = document.getElementById(safeId);
  if (el) el.className = 'px-3 py-2.5 rounded-lg cursor-pointer hover:bg-indigo transition text-sm bg-indigo border';
  if (el) el.style.borderColor = 'rgba(56,189,248,0.3)';

  fetch('/api/posts/' + encodeURIComponent(file)).then(r=>r.json()).then(data => {
    document.getElementById('editorPanel').style.display = '';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('editor').value = data.content;
    document.getElementById('editTitle').textContent = file.replace('.md','');
    if (showPreview) renderPreview();
  });
}

function savePost() {
  if (!currentFile) return;
  fetch('/api/posts/' + encodeURIComponent(currentFile), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({content: document.getElementById('editor').value})
  }).then(r=>r.json()).then(() => {
    loadPostList();
    showToast('保存成功');
  });
}

function togglePreview() {
  showPreview = !showPreview;
  document.getElementById('preview').style.display = showPreview ? 'block' : 'none';
  document.getElementById('editor').style.display = showPreview ? 'none' : 'block';
  document.getElementById('previewBtn').textContent = showPreview ? '编辑' : '预览';
  if (showPreview) renderPreview();
}

function renderPreview() {
  const md = document.getElementById('editor').value;
  const body = md.replace(/^---[\s\S]*?---\n/, '');
  let html = body
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.split('\n\n').map(function(p) {
    var t = p.trim();
    if (!t) return '';
    if (t.indexOf('<h') === 0 || t.indexOf('<img') === 0 || t.indexOf('<pre') === 0) return t;
    if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0) {
      var items = t.split('\n').map(function(l) { return '<li>' + l.replace(/^[-*] /,'') + '</li>'; }).join('');
      return '<ul>' + items + '</ul>';
    }
    return '<p>' + t.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  document.getElementById('preview').innerHTML = html;
}

function newPost() {
  document.getElementById('newPostModal').style.display = 'flex';
  document.getElementById('newTitle').value = '';
  document.getElementById('newSlug').value = '';
}

function closeModal() {
  document.getElementById('newPostModal').style.display = 'none';
}

function createPost() {
  var title = document.getElementById('newTitle').value;
  var slug = document.getElementById('newSlug').value;
  if (!slug) { alert('请填写 URL 标识'); return; }
  slug = slug.replace(/[^a-z0-9-]/g,'');
  fetch('/api/posts', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({title: title, slug: slug})
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { alert(e.error); throw e; });
    return r.json();
  }).then(function() {
    closeModal();
    loadPostList();
    loadPost(slug + '.md');
    showToast('文章已创建');
  }).catch(function(e) { if (e) console.error(e) });
}

function deploySite() {
  showToast('正在编译并发布...');
  var btn = event.target;
  btn.disabled = true;
  btn.textContent = '发布中...';
  fetch('/api/deploy', {method:'POST'})
    .then(function(r) { return r.json(); })
    .then(function(d) {
      showToast(d.success ? '发布成功！' : '发布失败: ' + (d.error || ''));
      btn.disabled = false;
      btn.innerHTML = '&#128640; 发布到线上';
    })
    .catch(function() {
      showToast('发布失败');
      btn.disabled = false;
      btn.innerHTML = '&#128640; 发布到线上';
    });
}

function showToast(msg) {
  var el = document.createElement('div');
  el.className = 'fixed bottom-6 right-6 border px-6 py-3 rounded-xl shadow-lg z-50 text-sm';
  el.style.background = '#1E293B';
  el.style.borderColor = 'rgba(56,189,248,0.3)';
  el.style.color = '#F8FAFC';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 3000);
}

function esc(s) { return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }

loadPostList();
</script>
</body>
</html>
