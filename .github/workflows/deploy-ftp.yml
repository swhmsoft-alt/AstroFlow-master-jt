# ============================================================
# 🚀 AstroFlow CI/CD — 自动部署到 cPanel (FTP)
# 触发条件: 推送 main 分支时自动部署
# ============================================================
name: Deploy to cPanel via FTP

on:
  push:
    branches: [main]

# 强制所有 JavaScript Action 运行在 Node.js 24，消除 Node 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 注意: 删除了 cache: 'npm'，防止坏缓存持续污染环境

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install basic-ftp --legacy-peer-deps

      - name: Build Astro site
        run: npm run build

      - name: Deploy to cPanel via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: node scripts/deploy-ftp-ci.mjs