# ============================================================
# 🚀 AstroFlow CI/CD — 自动部署到 cPanel (FTP)
# 触发条件: 推送 main 分支时自动部署
# ============================================================
name: Deploy to cPanel via FTP

on:
  push:
    branches: [main]

# 强制所有 JavaScript Action 运行在 Node.js 24，消除 Node 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 注意: 删除了 cache: 'npm'，防止坏缓存持续污染环境

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install basic-ftp --legacy-peer-deps

      - name: Build Astro site
        run: npm run build

      # ── 内部链接审计门禁 ────────────────────────────────────────
      # 验证 dist/sitemap*.xml 与 keywordMap + main-db 的一致性。
      # 如果 fabricated URL（404）存在，脚本以 exit 1 失败，中止部署。
      # 详细规范参见 SEMANTIC_CLOSURE.md §0.4 "Closed-Loop: Validate → Write"。
      - name: Audit internal links (no broken anchor links)
        id: link-audit
        run: node scripts/check-keyword-map.mjs

      - name: Upload broken-link audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-audit
          path: _audit/keywordmap_broken.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy to cPanel via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: node scripts/deploy-ftp-ci.mjs